name: Build APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'android/**'
      - 'index.html'
      - 'css/**'
      - 'js/**'
      - 'vendor/**'
      - 'fonts/**'
      - 'assets/**'
      - '.github/workflows/apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Bundle web app into Android assets
        run: |
          mkdir -p android/app/src/main/assets/www
          cp -r index.html css js vendor fonts assets android/app/src/main/assets/www/

      - name: Build signed APK
        run: cd android && gradle assembleRelease --no-daemon -q

      - name: Verify APK signature and package info
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk)
          echo "APK: $APK ($(du -h "$APK" | cut -f1))"
          "$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs "$APK" | head -6
          "$ANDROID_HOME/build-tools/34.0.0/aapt" dump badging "$APK" | head -4

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: minecraft-studio-apk
          path: android/app/build/outputs/apk/release/*.apk

      - name: Publish rolling release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk)
          cp "$APK" minecraft-studio.apk
          gh release view apk >/dev/null 2>&1 || gh release create apk --title "Minecraft Studio APK (latest)" --notes "Latest build from main. Sideload: allow 'Install unknown apps', then open the APK. Signed with the repo's debug key - Play Protect may warn; that is normal for sideloaded apps."
          gh release upload apk minecraft-studio.apk --clobber
