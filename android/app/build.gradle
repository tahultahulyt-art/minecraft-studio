plugins { id 'com.android.application' }

android {
    namespace 'com.rahul.minecraftstudio'
    compileSdk 34
    defaultConfig {
        applicationId 'com.rahul.minecraftstudio'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1'
    }
    signingConfigs {
        release {
            storeFile file('minecraft-debug.keystore')
            storePassword 'android'
            keyAlias 'studio'
            keyPassword 'android'
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
        debug {
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
dependencies {
    implementation 'androidx.webkit:webkit:1.10.0'
}
